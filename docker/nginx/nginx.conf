worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩配置
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream smartidc-backend {
        server smartidc-backend:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. AIOps SSE 流式诊断长连接 (强制关闭缓冲与代理缓存，保证打字机逐字推屏零延迟)
        location /api/v1/aiops/diagnose/stream {
            proxy_pass http://smartidc-backend;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;                # 必须关闭缓冲，确保逐字流式推流
            proxy_cache off;                    # 关闭代理缓存
            chunked_transfer_encoding on;       # 开启分块传输
            proxy_read_timeout 300s;            # 长连接保活超时
        }

        # 2. WebSocket 实时动环遥测与告警推屏
        location /ws/ {
            proxy_pass http://smartidc-backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }

        # 3. 移动端及基础 API 网关转发
        location /api/ {
            proxy_pass http://smartidc-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 4. Web 中台与 Uni-app H5 静态资源 (启用 SPA 路由兜底与静态资源缓存)
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;   # 解决 SPA 页面刷新 404
        }

        # 5. 静态资源长效缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
