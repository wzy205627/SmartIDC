      datasource:
        url: jdbc:postgresql://localhost:5433/smartidc_aiops
        jdbc-url: jdbc:postgresql://localhost:5433/smartidc_aiops
        username: smartidc
        password: smartidc123
        driver-class-name: org.postgresql.Driver
      default-ef-search: 100 # 在线检索前动态调大搜索深度
    checkpoint:
      key-prefix: "smartidc:graph:checkpoint:"
      ttl-seconds: 86400 # 快照保留 24 小时
